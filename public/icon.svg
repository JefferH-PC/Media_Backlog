<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="topCard" x1="100" y1="100" x2="412" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="300" y1="120" x2="380" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="8"/>

  <!-- Lower layer card -->
  <rect x="110" y="330" width="292" height="48" rx="24" fill="#3f3f46"/>

  <!-- Middle layer card -->
  <rect x="110" y="240" width="242" height="48" rx="24" fill="#71717a"/>

  <!-- Top layer card -->
  <rect x="110" y="150" width="292" height="48" rx="24" fill="url(#topCard)"/>

  <!-- Accent bookmark ribbon -->
  <path d="M304 135 V 295 L 344 270 L 384 295 V 135 Z" fill="url(#ribbon)"/>
</svg>
